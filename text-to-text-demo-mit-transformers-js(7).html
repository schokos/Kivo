<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Lokaler KI Sprachassistent</title>

<script type="importmap">
{
    "imports": {
        "@xenova/transformers":
        "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2"
    }
}
</script>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: auto;
    padding: 20px;
    background: #f5f5f5;
}

h1 {
    margin-bottom: 20px;
}

button {
    padding: 12px 20px;
    font-size: 16px;
    margin-right: 10px;
    cursor: pointer;
}

textarea {
    width: 100%;
    height: 350px;
    margin-top: 20px;
    padding: 10px;
    font-size: 16px;
}

#status {
    margin-top: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>Lokaler KI Sprachassistent</h1>

<button id="startBtn">
    Start
</button>

<button id="stopBtn" disabled>
    Stop
</button>

<div id="status">
    Lade Modelle...
</div>

<textarea id="log" readonly></textarea>

<script type="module">

import {
    pipeline,
    env
} from "@xenova/transformers";

env.allowLocalModels = false;

const statusDiv =
    document.getElementById("status");

const log =
    document.getElementById("log");

const startBtn =
    document.getElementById("startBtn");

const stopBtn =
    document.getElementById("stopBtn");


// Modelle
let asr;
let chat;
let tts;


// Audio
let audioContext;
let processor;
let source;
let stream;

let audioChunks = [];


// Hilfsfunktion Log
function addLog(text) {

    log.value += text + "\n\n";

    log.scrollTop =
        log.scrollHeight;
}


// Text sprechen
async function speak(text) {

    try {

        addLog("🔊 Sprache wird erzeugt...");

        const result =
            await tts(text);

        console.log(result);

        // Audio-Daten
        const audio =
            result.audio;

        const sampleRate =
            result.sampling_rate;

        // AudioBuffer erstellen
        const buffer =
            audioContext.createBuffer(
                1,
                audio.length,
                sampleRate
            );

        buffer.copyToChannel(
            audio,
            0
        );

        // Audio abspielen
        const src =
            audioContext.createBufferSource();

        src.buffer = buffer;

        src.connect(
            audioContext.destination
        );

        src.start();

    } catch (error) {

        console.error(error);

        addLog(
            "❌ TTS Fehler: " +
            error.message
        );
    }
}


// Float32Arrays zusammenfügen
function mergeBuffers(buffers) {

    let totalLength = 0;

    for (const b of buffers) {
        totalLength += b.length;
    }

    const result =
        new Float32Array(totalLength);

    let offset = 0;

    for (const b of buffers) {

        result.set(b, offset);

        offset += b.length;
    }

    return result;
}


// Modelle laden
async function loadModels() {

    try {

        statusDiv.textContent =
            "Lade Whisper...";

        asr = await pipeline(
            "automatic-speech-recognition",
            "Xenova/whisper-base",
            {
                device: "webgpu"
            }
        );

        statusDiv.textContent =
            "Lade Chatmodell...";

        chat = await pipeline(
            "text-generation",
            "Xenova/TinyLlama-1.1B-Chat-v1.0",
            {
                device: "webgpu"
            }
        );

        statusDiv.textContent =
            "Lade TTS...";

        tts = await pipeline(
            "text-to-speech",
            "Xenova/speecht5_tts",
            {
                device: "webgpu"
            }
        );

        statusDiv.textContent =
            "Bereit.";

        addLog(
            "✅ Alle Modelle geladen."
        );

        startBtn.disabled = false;

    } catch (error) {

        console.error(error);

        statusDiv.textContent =
            "Fehler: " + error.message;
    }
}


// Aufnahme starten
startBtn.onclick = async () => {

    stream =
        await navigator.mediaDevices.getUserMedia({
            audio: true
        });

    audioContext =
        new AudioContext({
            sampleRate: 16000
        });

    source =
        audioContext.createMediaStreamSource(
            stream
        );

    processor =
        audioContext.createScriptProcessor(
            4096,
            1,
            1
        );

    source.connect(processor);

    processor.connect(
        audioContext.destination
    );

    processor.onaudioprocess =
        (event) => {

        const data =
            event.inputBuffer.getChannelData(0);

        audioChunks.push(
            new Float32Array(data)
        );
    };

    // Alle 6 Sekunden verarbeiten
    window.interval =
        setInterval(async () => {

        if (audioChunks.length === 0) {
            return;
        }

        try {

            statusDiv.textContent =
                "Transkribiere...";

            const merged =
                mergeBuffers(audioChunks);

            audioChunks = [];

            // Sprache → Text
            const sttResult =
                await asr(
                    merged,
                    {
                        sampling_rate: 16000
                    }
                );

            const userText =
                sttResult.text?.trim();

            if (!userText) {
                return;
            }

            addLog(
                "🧑 Du: " +
                userText
            );

            statusDiv.textContent =
                "KI denkt nach...";

            // Chat
            const prompt =
                `<|user|>\n${userText}\n<|assistant|>`;

            const response =
                await chat(
                    prompt,
                    {
                        max_new_tokens: 80,
                        temperature: 0.7,
                        do_sample: true
                    }
                );

            console.log(response);

            let answer =
                response[0].generated_text;

            // Assistant-Teil extrahieren
            answer =
                answer.split("<|assistant|>")[1]
                ?.trim();

            if (!answer) {
                answer =
                    "Ich konnte keine Antwort erzeugen.";
            }

            addLog(
                "🤖 KI: " +
                answer
            );

            // Sprache erzeugen
            statusDiv.textContent =
                "Sprache wird erzeugt...";

            await speak(answer);

            statusDiv.textContent =
                "Live aktiv";

        } catch (error) {

            console.error(error);

            addLog(
                "❌ Fehler: " +
                error.message
            );

            statusDiv.textContent =
                "Fehler";
        }

    }, 6000);

    startBtn.disabled = true;
    stopBtn.disabled = false;

    statusDiv.textContent =
        "Live aktiv";
};


// Stoppen
stopBtn.onclick = () => {

    clearInterval(
        window.interval
    );

    processor.disconnect();

    source.disconnect();

    stream.getTracks().forEach(
        track => track.stop()
    );

    audioContext.close();

    startBtn.disabled = false;
    stopBtn.disabled = true;

    statusDiv.textContent =
        "Gestoppt";
};


// Start
loadModels();

</script>

</body>
</html>
